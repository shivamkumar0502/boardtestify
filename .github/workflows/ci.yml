name: Validate BoardTestify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm test
      - name: Install pinned MongoDB backup tools
        run: |
          curl --fail --location --max-time 120 https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.13.0.tgz --output /tmp/mongo-tools.tgz
          echo '49f00ac68f25451c3e936b06011df38009f8418dafb5aa425c2810e59fd02029  /tmp/mongo-tools.tgz' | sha256sum --check
          mkdir /tmp/mongo-tools
          tar -xzf /tmp/mongo-tools.tgz --strip-components=1 -C /tmp/mongo-tools
          echo /tmp/mongo-tools/bin >> "$GITHUB_PATH"
      - run: npm run test:integration
      - run: npm run test:load
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
  android-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx expo export --platform android --output-dir ../android-export
        working-directory: app

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag boardtestify:ci .
      - run: docker run --rm --entrypoint node boardtestify:ci -e "import('sharp').then(async ({default:s}) => { await s({create:{width:1,height:1,channels:3,background:'white'}}).jpeg().toBuffer(); console.log('Runtime image processing ready'); })"
      - run: docker run --rm --entrypoint pdfinfo boardtestify:ci -v
